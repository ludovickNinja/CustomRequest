<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Custom Request</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --gold: #b88a2a;
        --gold-deep: #8a6a0a;
        --stone-50: #fafaf9;
        --stone-200: #e7e5e4;
        --stone-500: #78716c;
        --stone-900: #1c1917;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--stone-50);
        color: var(--stone-900);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }
      .wrap { max-width: 720px; width: 100%; text-align: center; }
      h1 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: clamp(2rem, 4vw, 3rem);
        margin: 0 0 0.5rem;
        font-weight: 600;
      }
      .lede {
        color: var(--stone-500);
        margin: 0 0 2.25rem;
        font-size: 1rem;
      }
      .grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      @media (min-width: 640px) {
        .grid { grid-template-columns: 1fr 1fr; gap: 1.25rem; }
      }
      .card {
        display: block;
        text-decoration: none;
        color: inherit;
        background: #fff;
        border: 1px solid var(--stone-200);
        border-radius: 18px;
        padding: 1.75rem 1.5rem;
        text-align: left;
        transition: border-color 120ms ease, transform 120ms ease, box-shadow 120ms ease;
      }
      .card:hover {
        border-color: var(--gold);
        transform: translateY(-2px);
        box-shadow: 0 12px 24px -16px rgba(184, 138, 42, 0.4);
      }
      .badge {
        display: inline-block;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold-deep);
        background: rgba(184, 138, 42, 0.12);
        border-radius: 999px;
        padding: 0.15rem 0.55rem;
        margin-bottom: 0.75rem;
      }
      h2 {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      .card p { margin: 0; color: var(--stone-500); font-size: 0.9rem; line-height: 1.4; }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        margin-top: 1rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--gold-deep);
      }
      .cta::after { content: '→'; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Custom Request</h1>
      <p class="lede">Pick the version you want to open.</p>
      <div class="grid">
        <a class="card" href="./V1/">
          <span class="badge">V1</span>
          <h2>Full Flow</h2>
          <p>Contact info, design details, and Specifications step.</p>
          <span class="cta">Open V1</span>
        </a>
        <a class="card" href="./V2/">
          <span class="badge">V2</span>
          <h2>Streamlined</h2>
          <p>Same flow as V1 with the Specifications step removed.</p>
          <span class="cta">Open V2</span>
        </a>
      </div>
    </div>
  </body>
</html>
